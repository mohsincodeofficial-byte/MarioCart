<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07090e">
  <title>PES Controller – Kart Party</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/src/controller/pes-controls.css">
</head>
<body>
  <div class="pes-wrapper">
    <!-- Top Bar: Brand, Install App & Bluetooth Actions -->
    <header class="pes-top-bar">
      <div class="pes-brand">
        <span>⚡ PES</span> KART PRO
      </div>

      <div class="top-pills-row">
        <!-- 1-Tap Native Android App Install -->
        <button id="btnInstallApp" class="pes-pill-btn btn-install" title="Install as Native Android App">
          📲 INSTALL APP
        </button>

        <!-- Direct Bluetooth Connect -->
        <button id="btnBluetooth" class="pes-pill-btn" title="Connect via Bluetooth Radio">
          🔵 BLUETOOTH
        </button>

        <!-- Fullscreen Immersive Toggle -->
        <button id="btnFullscreen" class="pes-pill-btn" title="Toggle Fullscreen">
          ⛶ MAX
        </button>

        <div class="status-badge">
          <div id="statusDot" class="status-dot"></div>
          <span id="connStatus">Ready</span>
        </div>
      </div>
    </header>

    <!-- Center Speedometer & Gear HUD -->
    <div class="pes-center-hud">
      <div class="pes-speed-box">
        <span id="speedDisplay" class="pes-speed-val">0</span>
        <span class="pes-speed-unit">KM/H</span>
      </div>
    </div>

    <!-- Main Playing Field (Split Screen: Dynamic Joystick + Action Buttons) -->
    <main class="pes-field">
      <!-- LEFT HALF: PES Mobile Floating Movable Joystick Surface -->
      <section id="touchZoneLeft" class="zone-left-joystick" aria-label="PES Movable Analog Stick">
        <span class="stick-prompt">Touch anywhere to steer</span>

        <!-- Floating Joystick Base (Teleports dynamically under thumb) -->
        <div id="pesStickBase" class="pes-stick-base">
          <div id="pesStickPuck" class="pes-stick-puck"></div>
        </div>
      </section>

      <!-- RIGHT HALF: PES Mobile Big Action Touch Zones -->
      <section class="zone-right-actions" aria-label="PES Action Buttons">
        <!-- Secondary Actions (Drift & Reset) -->
        <div class="pes-side-actions">
          <button id="btnDrift" class="pes-sub-btn" aria-label="Drift / Handbrake">
            DRIFT
          </button>
          <button id="btnReset" class="pes-sub-btn" aria-label="Reset Kart">
            ↺
          </button>
        </div>

        <!-- Big Primary Buttons: SPRINT (GAS) & MATCH-UP (BRAKE) -->
        <div class="pes-big-btn-cluster">
          <button id="btnGas" class="pes-big-btn btn-sprint" aria-label="Sprint Gas">
            <span class="btn-icon">▲</span>
            <span class="btn-title">DASH / GAS</span>
          </button>

          <button id="btnBrake" class="pes-big-btn btn-brake" aria-label="Matchup Brake">
            <span class="btn-icon">■</span>
            <span class="btn-title">BRAKE / REV</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Bottom Diagnostics Bar -->
    <footer class="pes-footer">
      <div>LINK: <span id="netTypeVal">P2P UDP / BT</span></div>
      <div>LATENCY: <span id="rttVal">0 ms</span></div>
      <div>SAMPLE: <span id="rateVal">120 Hz</span></div>
    </footer>
  </div>

  <script type="module" src="/src/controller/main.ts"></script>
</body>
</html>
