<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kart Party – Controller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f0f6fc;
      touch-action: none;
    }

    .controller-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 12px 16px;
      justify-content: space-between;
    }

    /* Top Status Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 8px 14px;
      gap: 8px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: #21262d;
      border: 1px solid #30363d;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-top.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #ffffff;
    }

    /* Steering Angle Indicator Gauge */
    .steer-gauge-wrapper {
      margin: 8px auto 0 auto;
      width: 80%;
      max-width: 280px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      height: 10px;
      position: relative;
      overflow: hidden;
    }

    .steer-center-mark {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #484f58;
      transform: translateX(-50%);
    }

    .steer-pip {
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 14px;
      background: #38bdf8;
      border-radius: 3px;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.05s ease-out;
    }

    .motion-indicator-text {
      text-align: center;
      font-size: 11px;
      color: #8b949e;
      margin-top: 4px;
    }

    /* Main Gamepad Touch Area */
    .gamepad-area {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      gap: 16px;
    }

    .pad-cluster {
      display: flex;
      flex-direction: row;
      gap: 14px;
      align-items: center;
    }

    /* Big Ergonomic Touch Buttons */
    .game-btn {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.2);
      transition: transform 0.08s ease, background 0.08s ease, box-shadow 0.08s ease;
      touch-action: none;
    }

    .game-btn .icon {
      font-size: 32px;
      line-height: 1;
      margin-bottom: 4px;
      pointer-events: none;
    }

    .game-btn .label {
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* Steer Buttons */
    .btn-steer {
      width: 84px;
      height: 100px;
      background: linear-gradient(180deg, #2d3748, #1a202c);
      color: #edf2f7;
    }

    .btn-steer.active {
      transform: scale(0.92);
      background: linear-gradient(180deg, #3182ce, #2b6cb0);
      border-color: #63b3ed;
      box-shadow: 0 0 20px rgba(49, 130, 206, 0.8);
    }

    /* Action Buttons (Gas & Brake) */
    .btn-action {
      width: 95px;
      height: 105px;
    }

    .btn-gas {
      background: linear-gradient(180deg, #2e7d32, #1b5e20);
      color: #ffffff;
      border-color: #4caf50;
    }

    .btn-gas.active {
      transform: scale(0.92);
      background: linear-gradient(180deg, #43a047, #2e7d32);
      box-shadow: 0 0 24px rgba(76, 175, 80, 0.9);
      border-color: #81c784;
    }

    .btn-brake {
      background: linear-gradient(180deg, #c62828, #b71c1c);
      color: #ffffff;
      border-color: #e53935;
    }

    .btn-brake.active {
      transform: scale(0.92);
      background: linear-gradient(180deg, #e53935, #c62828);
      box-shadow: 0 0 24px rgba(229, 57, 53, 0.9);
      border-color: #ef9a9a;
    }

    /* Diagnostics Strip */
    .diag-strip {
      display: flex;
      justify-content: space-around;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      font-family: monospace;
    }

    .diag-val {
      color: #58a6ff;
      font-weight: 700;
    }

    /* Responsive adjustments for landscape */
    @media (orientation: landscape) {
      .gamepad-area {
        padding: 4px 20px;
      }
      .btn-steer {
        width: 100px;
        height: 110px;
      }
      .btn-action {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>
<body>
  <div class="controller-container">
    <!-- Top Status Bar -->
    <header class="top-bar">
      <div class="status-group">
        <span class="brand">🏎️ Controller</span>
        <span id="connStatus" class="badge">Connecting...</span>
      </div>
      <div class="top-actions">
        <button id="btnMotionToggle" class="btn-top">📐 Tilt</button>
        <button id="btnReset" class="btn-top" title="Reset kart to center">↺ Reset</button>
      </div>
    </header>

    <!-- Steering Visualizer Gauge -->
    <div>
      <div class="steer-gauge-wrapper">
        <div class="steer-center-mark"></div>
        <div id="steerVisual" class="steer-pip"></div>
      </div>
      <div id="motionStatus" class="motion-indicator-text">Touch Controls Active</div>
    </div>

    <!-- Main Gamepad Controls -->
    <main class="gamepad-area">
      <!-- Steering Cluster -->
      <section class="pad-cluster" aria-label="Steering">
        <button id="btnLeft" class="game-btn btn-steer" aria-label="Steer Left">
          <span class="icon">◀</span>
          <span class="label">LEFT</span>
        </button>
        <button id="btnRight" class="game-btn btn-steer" aria-label="Steer Right">
          <span class="icon">▶</span>
          <span class="label">RIGHT</span>
        </button>
      </section>

      <!-- Throttle & Brake Cluster -->
      <section class="pad-cluster" aria-label="Pedals">
        <button id="btnBrake" class="game-btn btn-action btn-brake" aria-label="Brake and Reverse">
          <span class="icon">■</span>
          <span class="label">BRAKE</span>
        </button>
        <button id="btnGas" class="game-btn btn-action btn-gas" aria-label="Accelerate">
          <span class="icon">▲</span>
          <span class="label">GAS</span>
        </button>
      </section>
    </main>

    <!-- Diagnostics Metrics Strip -->
    <footer class="diag-strip">
      <div>Rate: <span id="rateVal" class="diag-val">0 Hz</span></div>
      <div>RTT: <span id="rttVal" class="diag-val">0 ms</span></div>
      <div>Seq: <span id="seqVal" class="diag-val">#0</span></div>
    </footer>
  </div>

  <script type="module" src="/src/controller/main.ts"></script>
</body>
</html>
