name: Build and Commit Controller APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Wrapper and Build Debug APK
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Commit APK to Repository Root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./KartParty-Controller.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add KartParty-Controller.apk
          git commit -m "release: add compiled KartParty-Controller.apk for direct phone download" || echo "No changes to commit"
          git push

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KartParty-Controller-Debug
          path: KartParty-Controller.apk
          retention-days: 30
